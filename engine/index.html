<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rich Girl Code — Daily Content Engine</title>
<meta name="description" content="Storyboard-first daily carousel engine for @richgirlcode and Options Traders Academy." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <span class="dot">RGC</span>
      <span>CONTENT ENGINE<small id="today">—</small></span>
    </div>
    <div id="gate" style="display:flex;gap:16px;align-items:center"></div>
    <nav class="tabs">
      <button data-act="view" data-view="survey">1 · Survey</button>
      <button data-act="view" data-view="calendar">2 · Plan</button>
      <button data-act="view" data-view="storyboard">3 · Storyboard</button>
      <button data-act="view" data-view="build">4 · Build 🔒</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-survey"></section>
  <section class="view" id="v-calendar"></section>
  <section class="view" id="v-storyboard"></section>
  <section class="view" id="v-build"></section>
</main>

<div id="toast"></div>

<script src="data.js"></script>
<script src="paint.js"></script>
<script src="engine.js"></script>
<script src="store.js"></script>
<script src="build.js"></script>
<script src="ui.js"></script>
<script>RGC.ui.boot();</script>
</body>
</html>
