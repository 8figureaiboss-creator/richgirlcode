<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Charts — local test harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0f0d; }
      #wrap { position: fixed; inset: 0; padding: 12px; }
      #fixture-banner { display: none; position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 99;
        background: #b00020; color: #fff; font: 700 12px system-ui; padding: 6px 12px; border-radius: 8px; letter-spacing: .04em; }
      body.fixture #fixture-banner { display: block; }
      body.fixture .otac-badge, body.fixture .otac-legend .src { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="fixture-banner">TEST FIXTURE — synthetic candles for layout testing only, not market data</div>
    <div id="wrap"><div id="charts" style="height:100%"></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
